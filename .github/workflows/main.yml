name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules with retry (optional)
        shell: bash
        run: |
          git config --global http.version HTTP/1.1
          mapfile -t submodules < <(
            git config --file .gitmodules --get-regexp path |
            awk '{print $2}'
          )
          initialized=()
          skipped=()

          for sub in "${submodules[@]}"; do
            ok=0
            for i in 1 2 3 4 5; do
              echo "Submodule $sub - attempt $i/5"
              if git submodule update --init --depth 1 -- "$sub"; then
                ok=1
                break
              fi

              git submodule deinit -f -- "$sub" || true
              rm -rf -- "$sub" ".git/modules/$sub"
              sleep 5
            done

            if [ "$ok" -eq 1 ]; then
              echo "Initialized submodule: $sub"
              initialized+=("$sub")
            else
              echo "Skipped submodule after 5 failed attempts: $sub"
              skipped+=("$sub")
            fi
          done

          echo "Initialized submodules: ${initialized[*]:-none}"
          echo "Skipped submodules: ${skipped[*]:-none}"

          {
            echo "### Git submodules"
            echo ""
            echo "**Initialized:** ${initialized[*]:-none}"
            echo ""
            echo "**Skipped after retries:** ${skipped[*]:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        run: npx vite build --base=/neos-ts/ && cp -r neos-assets dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
